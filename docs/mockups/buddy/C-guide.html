<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>캐릭터 도감</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&amp;family=Press+Start+2P&amp;display=swap">
<style>
body{margin:0}
.pxo{clip-path:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px),0 8px,4px 8px,4px 4px,8px 4px)}
</style>
</helmet>
<div style="width: 1440px; height: 1040px; box-sizing: border-box; padding: 48px 64px; background: #EFE6D2; color: #2B2140; font-family: 'Noto Sans KR', system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-family: 'Press Start 2P', monospace; font-size: 11px; color: #4C46B8">BUDDY GUIDE</span>
    <h1 style="margin: 0; font-size: 30px; font-weight: 900">캐릭터 도감 · 여섯 명의 팀원</h1>
    <p style="margin: 0; font-size: 15px; color: #6B5A48">머리가 큰 2등신 꼬마 비율의 16비트 픽셀 캐릭터예요. 성격에 따라 말투가 달라서, 같은 알림도 캐릭터마다 다르게 말해요.</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
    <sc-for list="{{roster}}" as="r" hint-placeholder-count="6">
      <div class="pxo" style="background: #4A3020; padding: 4px">
        <div class="pxo" style="background: #FFF6DE; padding: 12px 16px; display: flex; gap: 12px; align-items: center">
          <div class="pxo" style="width: 128px; height: 168px; background: {{r.tag}}; display: flex; align-items: flex-end; justify-content: center; flex-shrink: 0; overflow: hidden">
            <dc-import name="Buddy" char="{{r.id}}" state="idle" size="150" hint-size="152px,158px"></dc-import>
          </div>
          <div style="display: flex; flex-direction: column; gap: 7px; min-width: 0">
            <span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 20px; font-weight: 900">{{r.name}}</span><span class="pxo" style="padding: 2px 8px; background: {{r.tag}}; font-size: 11px; font-weight: 900">{{r.concept}}</span></span>
            <span style="font-size: 13px; color: #6B5A48; line-height: 1.5">{{r.desc}}</span>
            <span style="font-size: 12px; font-weight: 900; color: #C2306A">말투</span>
            <span style="font-size: 13px; font-weight: 700; line-height: 1.5">"{{r.line}}"</span>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 15px; font-weight: 900">상태 4종 · 모모 예시</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{states}}" as="s" hint-placeholder-count="4">
        <div class="pxo" style="background: #4A3020; padding: 4px">
          <div class="pxo" style="background: {{s.bg}}; padding: 10px 14px; display: flex; align-items: center; gap: 10px">
            <dc-import name="Buddy" char="momo" state="{{s.id}}" size="130" hint-size="144px,150px"></dc-import>
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 15px; font-weight: 900">{{s.name}}</span>
              <span style="font-size: 12px; color: #6B5A48; line-height: 1.5">{{s.when}}</span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      roster: [
        { id: 'leo', name: '레오', concept: '카리스마', tag: '#C9D2FF', desc: '슬릭백에 네이비 수트, 와인색 넥타이. 짧고 굵게 보고하는 리더형', line: '대표님, 컨펌 한 건 대기 중입니다. 지금 보시죠.' },
        { id: 'luna', name: '루나', concept: '멋쟁이', tag: '#F2D9A8', desc: '긴 머리에 선글라스, 크림 트렌치. 감각 좋은 트렌드세터', line: '카피 v2 나왔어요. 꽤 괜찮을걸요? 한 번 봐줘요~' },
        { id: 'momo', name: '모모', concept: '귀여운', tag: '#FFC2D6', desc: '리본 단 단발에 노란 셔츠. 팀 분위기를 살리는 비타민', line: '대표님~! 카피가 기다리고 있어요. 봐주세요 ♡' },
        { id: 'doyun', name: '도윤', concept: '열정', tag: '#FFC9BF', desc: '삐죽머리에 빨간 맨투맨. 데드라인 앞에서 불타는 타입', line: '대표님!! 데드라인 하루 남았어요! 같이 달려요!' },
        { id: 'haru', name: '하루', concept: '차분', tag: '#C6EDE3', desc: '올림머리에 동그란 안경, 민트 니트. 꼼꼼한 정리왕', line: '확인이 필요한 건이 하나 있어요. 시간 될 때 봐주세요.' },
        { id: 'jun', name: '준', concept: '힙', tag: '#E6E3FF', desc: '보라 캡에 오버핏 후드. 트렌드에 제일 빠른 막내', line: '대표님, 새 리퀘스트 들어왔어요. 체크 한 번 가실까요?' }
      ],
      states: [
        { id: 'work', name: '일하는 중', when: '팀이 정상 진행 중 · 노트북 타이핑', bg: '#FFF6DE' },
        { id: 'alert', name: '확인 필요', when: '컨펌 대기 · 손 들고 말풍선', bg: '#EDEBFF' },
        { id: 'urgent', name: '긴급', when: '딜레이·성과 이상 · 땀 + 빨간 배지', bg: '#FFE1DC' },
        { id: 'sleep', name: '쉬는 중', when: '확인할 일 없음 · 방해 금지', bg: '#E4DCCB' }
      ]
    };
  }
}
</script>
</body>
</html>
