<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="token" content="__TOKEN__">
<title>마스터마케터</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<script>try{var t=localStorage.getItem("theme");document.documentElement.dataset.theme=t==="dark"||t==="light"?t:(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app" class="app">
  <nav class="rail" id="rail" aria-label="어카운트와 홈"></nav>
  <aside class="side" aria-label="어카운트 목록">
    <div class="acct-list" id="acctList"></div>
    <div class="side-foot"><p>AI 검수 통과 ≠ 대표 컨펌 ≠ 법적 적합성 확정</p></div>
  </aside>

  <main class="main">
    <div class="topline"><span id="topR"></span></div>
    <div class="content acct-head" id="acctHead"></div>
    <div class="content" id="view"></div>
  </main>
</div>

<aside class="drawer" id="drawer" role="dialog" aria-labelledby="drTitle" hidden></aside>
<aside class="drawer wide" id="detail" role="dialog" aria-labelledby="dtTitle" hidden></aside>
<div class="scrim" id="scrim" hidden></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/buddy-sprite.js"></script>
<script src="/app.js"></script>
</body>
</html>
